 <!DOCTYPE html><html lang="pt-BR"><head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Gastos PRO - Finanças Premium</title>

<style>

:root {

--bg-color: #0f172a;

--card-bg: #1e293b;

--accent-primary: #3b82f6;

--accent-success: #10b981;

--accent-danger: #ef4444;

--text-main: #f8fafc;

--text-muted: #94a3b8;

--border-color: #334155;

}


* {

box-sizing: border-box;

margin: 0;

padding: 0;

font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}


body {

background-color: var(--bg-color);

color: var(--text-main);

display: flex;

justify-content: center;

padding: 16px;

min-height: 100vh;

}


.container {

width: 100%;

max-width: 600px;

}


header {

text-align: center;

margin-bottom: 24px;

padding-top: 12px;

}


header h1 {

font-size: 1.8rem;

font-weight: 700;

}


header h1 span {

color: var(--accent-primary);

font-size: 0.9rem;

background: rgba(59, 130, 246, 0.2);

padding: 2px 8px;

border-radius: 12px;

vertical-align: middle;

}


header p {

color: var(--text-muted);

font-size: 0.85rem;

margin-top: 4px;

}


.summary-grid {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 12px;

margin-bottom: 24px;

}


.summary-card {

background: var(--card-bg);

border: 1px solid var(--border-color);

border-radius: 12px;

padding: 12px;

text-align: center;

}


.summary-card span.title {

font-size: 0.75rem;

color: var(--text-muted);

display: block;

margin-bottom: 4px;

}


.summary-card .value {

font-size: 1.1rem;

font-weight: bold;

}


.summary-card.income .value { color: var(--accent-success); }

.summary-card.expense .value { color: var(--accent-danger); }

.summary-card.balance .value { color: var(--accent-primary); }


.form-section {

background: var(--card-bg);

border: 1px solid var(--border-color);

border-radius: 12px;

padding: 16px;

margin-bottom: 24px;

}


.form-section h2 {

font-size: 1.1rem;

margin-bottom: 12px;

display: flex;

align-items: center;

gap: 8px;

}


.form-group {

margin-bottom: 12px;

}


.form-group label {

display: block;

font-size: 0.8rem;

color: var(--text-muted);

margin-bottom: 4px;

}


.form-group input, .form-group select {

width: 100%;

padding: 10px;

border-radius: 8px;

border: 1px solid var(--border-color);

background: #0f172a;

color: var(--text-main);

font-size: 0.95rem;

}


.type-selector {

display: flex;

gap: 8px;

margin-bottom: 12px;

}


.type-btn {

flex: 1;

padding: 10px;

border: 1px solid var(--border-color);

background: transparent;

color: var(--text-muted);

border-radius: 8px;

cursor: pointer;

font-weight: 600;

transition: all 0.2s;

}


.type-btn.active.income {

background: rgba(16, 185, 129, 0.2);

border-color: var(--accent-success);

color: var(--accent-success);

}


.type-btn.active.expense {

background: rgba(239, 68, 68, 0.2);

border-color: var(--accent-danger);

color: var(--accent-danger);

}


.submit-btn {

width: 100%;

padding: 12px;

background: var(--accent-primary);

border: none;

border-radius: 8px;

color: white;

font-weight: bold;

font-size: 1rem;

cursor: pointer;

}


.list-section {

background: var(--card-bg);

border: 1px solid var(--border-color);

border-radius: 12px;

padding: 16px;

}


.list-section h3 {

font-size: 1.1rem;

margin-bottom: 12px;

}


.item-list {

list-style: none;

}


.item {

display: flex;

justify-content: space-between;

align-items: center;

padding: 10px 0;

border-bottom: 1px solid var(--border-color);

}


.item:last-child {

border-bottom: none;

}


.item-info .title {

font-weight: 600;

font-size: 0.95rem;

}


.item-info .category {

font-size: 0.75rem;

color: var(--text-muted);

}


.item-amount {

font-weight: bold;

font-size: 0.95rem;

}


.item-amount.income { color: var(--accent-success); }

.item-amount.expense { color: var(--accent-danger); }

</style></head><body>


<div class="container">

<header>

<h1>Controle Gastos <span>PRO</span></h1>

<p>App Nativo de Alta Performance</p>

</header>


<main>

<section class="summary-grid">

<div class="summary-card income">

<span class="title">📈 Receitas</span>

<div class="value" id="total-income">R$ 0,00</div>

</div>

<div class="summary-card expense">

<span class="title">📉 Despesas</span>

<div class="value" id="total-expense">R$ 0,00</div>

</div>

<div class="summary-card balance">

<span class="title">⚖️ Saldo</span>

<div class="value" id="total-balance">R$ 0,00</div>

</div>

</section>


<section class="form-section">

<h2>✨ Novo Lançamento</h2>

<div class="type-selector">

<button type="button" class="type-btn active expense" id="btn-expense" onclick="setType('expense')">Despesa</button>

<button type="button" class="type-btn" id="btn-income" onclick="setType('income')">Receita</button>

</div>


<form id="transaction-form" onsubmit="addTransaction(event)">

<div class="form-group">

<label for="description">Descrição</label>

<input type="text" id="description" placeholder="Ex: Mercado, Salário..." required>

</div>


<div class="form-group">

<label for="amount">Valor (R$)</label>

<input type="number" id="amount" step="0.01" placeholder="0,00" required>

</div>


<div class="form-group">

<label for="category">Categoria</label>

<select id="category">

<option value="Alimentação">Alimentação</option>

<option value="Moradia">Moradia</option>

<option value="Transporte">Transporte</option>

<option value="Lazer">Lazer</option>

<option value="Saúde">Saúde</option>

<option value="Cuidados Pessoais">Cuidados Pessoais</option>

<option value="Renda Extra">Renda Extra</option>

<option value="Outros">Outros</option>

</select>

</div>


<button type="submit" class="submit-btn">Adicionar Lançamento</button>

</form>

</section>


<section class="list-section">

<h3>📋 Lançamentos</h3>

<ul class="item-list" id="transaction-list">

</ul>

</section>

</main>

</div>


<script>

let currentType = 'expense';

let transactions = JSON.parse(localStorage.getItem('transactions')) || [];


function setType(type) {

currentType = type;

document.getElementById('btn-expense').className = `type-btn ${type === 'expense' ? 'active expense' : ''}`;

document.getElementById('btn-income').className = `type-btn ${type === 'income' ? 'active income' : ''}`;

}


function formatCurrency(value) {

return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

}


function updateSummary() {

const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);

const expense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);

const balance = income - expense;


document.getElementById('total-income').innerText = formatCurrency(income);

document.getElementById('total-expense').innerText = formatCurrency(expense);

document.getElementById('total-balance').innerText = formatCurrency(balance);

}


function renderTransactions() {

const listEl = document.getElementById('transaction-list');

listEl.innerHTML = '';


transactions.forEach((t, index) => {

const li = document.createElement('li');

li.className = 'item';

li.innerHTML = `

<div class="item-info">

<div class="title">${t.description}</div>

<div class="category">${t.category}</div>

</div>

<div class="item-amount ${t.type}">

${t.type === 'expense' ? '-' : '+'} ${formatCurrency(t.amount)}

</div>

`;

listEl.appendChild(li);

});


updateSummary();

}


function addTransaction(e) {

e.preventDefault();

const description = document.getElementById('description').value;

const amount = parseFloat(document.getElementById('amount').value);

const category = document.getElementById('category').value;


if (!description || isNaN(amount)) return;


const newTransaction = {

description,

amount,

category,

type: currentType

};


transactions.unshift(newTransaction);

localStorage.setItem('transactions', JSON.stringify(transactions));

document.getElementById('transaction-form').reset();

renderTransactions();

}


renderTransactions();

</script></body></html>
